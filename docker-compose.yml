services:
  cairn:
    image: ghcr.io/firn-labs/cairn:latest
    # To build from source instead, replace the image line with: build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/cairn.db
    volumes:
      - cairn-data:/app/data
      # Cairn spawns sibling workspace containers for agent teams (issue #2).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  cairn-data:
