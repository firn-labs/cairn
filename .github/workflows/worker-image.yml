name: Worker image

# Builds ghcr.io/firn-labs/cairn-worker — the pre-built workspace image with
# the CLI-executor tools installed (issue #29). Rebuilt weekly so the CLIs
# stay current even when Dockerfile.worker itself does not change.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.worker
      - .github/workflows/worker-image.yml
  pull_request:
    paths:
      - Dockerfile.worker
      - .github/workflows/worker-image.yml
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (and push from main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push unless PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/firn-labs/cairn-worker:latest
            ghcr.io/firn-labs/cairn-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/firn-labs/cairn
            org.opencontainers.image.description=Cairn team workspace image with pre-installed coding CLIs
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
