name: Worker image

# Builds ghcr.io/firn-labs/cairn-worker — the pre-built workspace image with
# the CLI-executor tools installed (issue #29). Tool versions are pinned in
# docker/worker/package.json and bumped by Dependabot (issue #40); the weekly
# rebuild exists only to pick up base-image (Debian/Node) security updates.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.worker
      - docker/worker/**
      - .github/workflows/worker-image.yml
  pull_request:
    paths:
      - Dockerfile.worker
      - docker/worker/**
      - .github/workflows/worker-image.yml
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC (base-image refresh)
  workflow_dispatch:

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (and push from main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push unless PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/firn-labs/cairn-worker:latest
            ghcr.io/firn-labs/cairn-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/firn-labs/cairn
            org.opencontainers.image.description=Cairn team workspace image with pre-installed coding CLIs
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  cleanup:
    # Prune old cairn-worker versions after every push (issue #41): scheduled
    # rebuilds re-push the same tags, orphaning the previous multi-arch
    # manifests, which would otherwise accumulate forever. This action (unlike
    # actions/delete-package-versions) understands multi-arch images, so child
    # platform manifests of kept versions are never deleted.
    name: Prune old versions
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: cairn-worker
          exclude-tags: latest
          keep-n-tagged: 5
          delete-untagged: true
          validate: true
